name: noor
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  adhan: ^2.0.0+1
  auto_size_text: ^3.0.0
  connectivity_plus: ^6.1.5
  cupertino_icons: ^1.0.8
  dart_either: ^2.0.0
  dashed_circular_progress_bar: ^0.0.6
  dio: ^5.9.0
  dotted_border: ^3.1.0
  dotted_line: ^3.2.3
  drift: ^2.28.1
  drift_flutter: ^0.2.5
  extended_tabs: ^5.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^19.4.1
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.6
  flutter_qiblah: ^3.1.0+1
  flutter_svg: ^2.2.0
  flutter_timezone: ^4.1.1
  font_awesome_flutter: ^10.9.1
  geocoding: ^4.0.0
  geolocator: ^13.0.4
  get_it: ^8.2.0
  google_maps_flutter: ^2.12.3
  google_nav_bar: ^5.0.7
  highlight_text: ^1.8.0
  hijri: ^3.0.0
  injectable: ^2.5.1
  intl: ^0.20.2
