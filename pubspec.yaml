  syncfusion_flutter_core: ^30.2.7
  syncfusion_flutter_datepicker: ^30.2.7
  timezone: ^0.10.1
  url_launcher: ^6.3.2
  visibility_detector: ^0.4.0+2

dev_dependencies:
