  json_annotation: ^4.9.0
  just_audio: ^0.10.5
  logger: ^2.6.2
  marquee: ^2.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  piri_qiblah: ^0.0.2
  retrofit: ^4.7.3
  rflutter_alert: ^2.0.7
  scrollable_positioned_list: ^0.3.8
  shared_preferences: ^2.5.3
  sleek_circular_slider: ^2.1.0
  sqlite3: ^2.9.0
